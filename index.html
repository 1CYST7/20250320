<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>自我介紹</title>
  
  <style>
    h2 {
      color: #7a7a7a; 
    }
    a {
      border: 2px solid #d6c2b9; /* 綠色邊框，2px寬 */
      border-radius: 8px; /* 圓角邊框 */
      padding: 10px 20px; /* 內邊距讓內容不貼邊 */
      display: inline-block; /* 讓連結更像按鈕 */
      text-decoration: none; /* 移除底線 */
      color: #000000; 
      transition: all 0.3s ease; /* 添加過渡效果 */
    }
    a:hover {
      background-color: #a5969b; 
      color: white; 
    }
  </style>

</head>
<body>
  <header>
    <h1>歡迎來到我的自我介紹網站</h1>
    <hr>
  </header>
  <a href="index.html">首頁</a>
  <a href="about.html">關於我</a>
  <a href="research.html">研究</a>
  <a href="hw_1.html">N*N 乘法表</a>
  <section id="about">
    <h2>關於我</h2>
    <p>你好！我是胡芊杏，就讀於南臺科技大學資工系。</p>
  </section>

  <section id="skills">
    <h2>學過的程式語言</h2>
    <ul>
      <li>HTML / CSS / JavaScript</li>
      <li>Arduino 開發</li>
      <li>物聯網應用</li>
      <li>嵌入式系統設計</li>
    </ul>
  </section>

  <section id="contact">
    <h2>有甚麼意見啦</h2>
    <form id="contact-form">
      

      <label for="message">訊息：</label>
      <textarea id="message" name="message" required></textarea>

      <button type="submit">送出</button>
    </form>
  </section>

  <script>
    document.getElementById('contact-form').addEventListener('submit', function(event) {
      event.preventDefault();
      
      const message = document.getElementById('message').value;
      alert(`謝謝你的訊息！我還是不會改^^\n訊息: ${message}`);
    });
  </script>
</body>
</html>
