<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>技能 Skills</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="skills-style.css" />
</head>
<body>
  <header>
    <nav>
      <a href="index.html"><h1>Self Introduction</h1></a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">首頁</a></li>
        <li><a href="about.html" class="nav-link">關於我</a></li>
        <li><a href="skills.html" class="nav-link active">技能</a></li>
        <li><a href="portfolio.html" class="nav-link">作品集</a></li>
        <li><a href="contact.html" class="nav-link">告訴我</a></li>
        <span class="nav-underline"></span>
      </ul>
    </nav>
  </header>

  <main>

    <!-- 技能熟練度條 -->
    <section class="skill-bars">
      <h3>Skills & Tools</h3>

      <div class="bar-item">
        <div class="bar-label">HTML</div>
        <div class="bar-bg"><div class="bar-fill" style="width: 80%;"></div></div>
      </div>

      <div class="bar-item">
        <div class="bar-label">CSS</div>
        <div class="bar-bg"><div class="bar-fill" style="width: 70%;"></div></div>
      </div>

      <div class="bar-item">
        <div class="bar-label">JavaScript</div>
        <div class="bar-bg"><div class="bar-fill" style="width: 60%;"></div></div>
      </div>

      <div class="bar-item">
        <div class="bar-label">Python</div>
        <div class="bar-bg"><div class="bar-fill" style="width: 75%;"></div></div>
      </div>
      <br>
      <div class="bar-item">
        <div class="bar-label">GitHub</div>
        <div class="bar-bg"><div class="bar-fill" style="width: 75%;"></div></div>
      </div>

      <div class="bar-item">
        <div class="bar-label">React</div>
        <div class="bar-bg"><div class="bar-fill" style="width: 40%;"></div></div>
      </div>
    </section>
  </main>

  <script>
  document.addEventListener("DOMContentLoaded", () => {
    // ⭐ 導覽列底線動畫
    const navLinks = document.querySelectorAll(".nav-links .nav-link");
    const underline = document.querySelector(".nav-underline");
    let currentActive = document.querySelector(".nav-link.active");

    function moveUnderline(el) {
      const linkRect = el.getBoundingClientRect();
      const navRect = el.closest(".nav-links").getBoundingClientRect();
      underline.style.width = linkRect.width + "px";
      underline.style.left = linkRect.left - navRect.left + "px";
    }

    navLinks.forEach(link => {
      link.addEventListener("mouseenter", () => moveUnderline(link));
      link.addEventListener("mouseleave", () => {
        if (currentActive) moveUnderline(currentActive);
      });
    });

    if (currentActive) moveUnderline(currentActive);

    // ⭐ 技能條動畫效果
    const fills = document.querySelectorAll(".bar-fill");
    fills.forEach(fill => {
      const width = fill.style.width;
      fill.style.setProperty("--target-width", width);
      fill.style.width = "0"; // 初始重設
      setTimeout(() => {
        fill.classList.add("animated");
      }, 100);
    });
  });
</script>

</body>
</html>
