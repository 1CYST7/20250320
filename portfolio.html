  <main class="portfolio-container">

    </div>
    </div>
  </main>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const navLinks = document.querySelectorAll(".nav-links .nav-link");
      const underline = document.querySelector(".nav-underline");
      let currentActive = document.querySelector(".nav-link.active");

      function moveUnderline(el) {
        const linkRect = el.getBoundingClientRect();
        const navRect = el.closest(".nav-links").getBoundingClientRect();
        underline.style.width = linkRect.width + "px";
        underline.style.left = linkRect.left - navRect.left + "px";
      }

      // 滑過去時移動
      navLinks.forEach(link => {
        link.addEventListener("mouseenter", () => moveUnderline(link));
        link.addEventListener("mouseleave", () => {
          if (currentActive) moveUnderline(currentActive);
        });
      });

      // 初始定位在 active 的地方
      if (currentActive) moveUnderline(currentActive);
    });
</script>
</body>
