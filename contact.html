<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>告訴我</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="contact-style.css" />
</head>
<body>
  <header>
    <nav>
      <a href="index.html"><h1>Self Introduction</h1></a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">首頁</a></li>
        <li><a href="about.html" class="nav-link">關於我</a></li>
        <li><a href="experience.html" class="nav-link">就學經歷</a></li>
        <li><a href="#portfolio" class="nav-link">作品集</a></li>
        <li><a href="contact.html" class="nav-link active">告訴我</a></li>
        <span class="nav-underline"></span>
      </ul>
    </nav>
  </header>

  <main class="contact-container">
    <h2>有甚麼想法!</h2>
    <form id="contactForm">
      <label for="name">你的名字</label>
      <input type="text" id="name" name="name" required />

      <label for="message">留言內容</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit" class="btn">送出留言</button>
    </form>
    <div id="notification" class="hidden">🎉 我已經收到你的訊息囉！</div>
  </main>

  <script>
  document.addEventListener("DOMContentLoaded", () => {
    // ======= 導覽列底線效果 =======
    const navLinks = document.querySelectorAll(".nav-links .nav-link");
    const underline = document.querySelector(".nav-underline");
    const currentActive = document.querySelector(".nav-link.active");

    function moveUnderline(el) {
      const linkRect = el.getBoundingClientRect();
      const navRect = el.closest(".nav-links").getBoundingClientRect();
      underline.style.width = linkRect.width + "px";
      underline.style.left = linkRect.left - navRect.left + "px";
    }

    navLinks.forEach(link => {
      link.addEventListener("mouseenter", () => moveUnderline(link));
      link.addEventListener("mouseleave", () => {
        if (currentActive) moveUnderline(currentActive);
      });
    });

    if (currentActive) moveUnderline(currentActive);

    // ======= 表單留言通知效果 =======
    const form = document.getElementById("contactForm");
    const notification = document.getElementById("notification");

    if (form && notification) {
      form.addEventListener("submit", function (e) {
        e.preventDefault(); // 阻止實際送出
        notification.classList.remove("hidden");
        form.reset(); // 清空表單

        setTimeout(() => {
          notification.classList.add("hidden");
        }, 3000);
      });
    }
  });
</script>

</body>
</html>
